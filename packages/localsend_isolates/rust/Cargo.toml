[package]
name = "rust_lib_localsend_app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dependencies]
anyhow = "1.0"
bytes = "1.12"
flutter_rust_bridge = { version = "=2.12.0", features = ["uuid"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22" }
uuid = { version = "1.24.0", features = ["v4"] }

# OHOS: the `webrtc` crate (via `nix`) does not build for aarch64-unknown-linux-ohos yet,
# so the WebRTC feature is excluded there. The Dart side already keeps WebRTC disabled
# (`webRTCEnabled = false`), and api/webrtc.rs provides stubs with identical signatures
# so the flutter_rust_bridge generated code compiles unchanged. The `discovery`
# feature (scan/discovery protocol) is required by api/discovery.rs.
[target.'cfg(not(target_env = "ohos"))'.dependencies]
localsend = { path = "../../core", features = ["full"] }

[target.'cfg(target_env = "ohos")'.dependencies]
localsend = { path = "../../core", features = ["crypto", "discovery", "http", "multicast"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
